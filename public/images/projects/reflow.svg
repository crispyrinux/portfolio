<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="ReFlow cover">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <pattern id="p" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" fill="none" stroke="#ffffff" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="400" height="300" fill="url(#g)"/>
  <rect width="400" height="300" fill="url(#p)"/>
  <rect x="0" y="0" width="400" height="6" fill="#c084fc" opacity="0.8"/>
  <rect x="0" y="294" width="400" height="6" fill="#c084fc" opacity="0.8"/>

  <!-- Tokenized Blocks & Chain Link -->
  <rect x="70" y="110" width="60" height="60" rx="6" fill="none" stroke="#c084fc" stroke-width="3"/>
  <rect x="170" y="110" width="60" height="60" rx="6" fill="none" stroke="#a855f7" stroke-width="3"/>
  <rect x="270" y="110" width="60" height="60" rx="6" fill="none" stroke="#818cf8" stroke-width="3"/>

  <!-- Connectors -->
  <line x1="130" y1="140" x2="170" y2="140" stroke="#c084fc" stroke-width="3" stroke-dasharray="3 3"/>
  <line x1="230" y1="140" x2="270" y2="140" stroke="#a855f7" stroke-width="3" stroke-dasharray="3 3"/>

  <!-- Smart contract tokens -->
  <circle cx="100" cy="140" r="10" fill="#c084fc" opacity="0.6"/>
  <circle cx="200" cy="140" r="10" fill="#a855f7" opacity="0.6"/>
  <circle cx="300" cy="140" r="10" fill="#818cf8" opacity="0.6"/>

  <text x="24" y="40" font-family="ui-monospace, monospace" font-size="15" fill="#f4f1e8" opacity="0.92" letter-spacing="0.5">ReFlow</text>
  <text x="24" y="272" font-family="ui-monospace, monospace" font-size="12" fill="#c084fc" opacity="0.95" letter-spacing="2">P2P LENDING &amp; TOKENIZATION</text>
</svg>
