<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Expert System CBR cover">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
    <pattern id="p" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" fill="none" stroke="#ffffff" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="400" height="300" fill="url(#g)"/>
  <rect width="400" height="300" fill="url(#p)"/>
  <rect x="0" y="0" width="400" height="6" fill="#84cc16" opacity="0.8"/>
  <rect x="0" y="294" width="400" height="6" fill="#84cc16" opacity="0.8"/>

  <!-- Decision Tree & CBR Nearest Neighbor cluster -->
  <circle cx="200" cy="95" r="14" fill="#84cc16"/>
  <circle cx="110" cy="155" r="10" fill="#4ade80"/>
  <circle cx="290" cy="155" r="10" fill="#4ade80"/>
  <circle cx="70" cy="210" r="7" fill="#22c55e"/>
  <circle cx="150" cy="210" r="7" fill="#22c55e"/>
  <circle cx="250" cy="210" r="7" fill="#22c55e"/>
  <circle cx="330" cy="210" r="7" fill="#22c55e"/>

  <line x1="200" y1="95" x2="110" y2="155" stroke="#84cc16" stroke-width="2.5"/>
  <line x1="200" y1="95" x2="290" y2="155" stroke="#84cc16" stroke-width="2.5"/>
  <line x1="110" y1="155" x2="70" y2="210" stroke="#4ade80" stroke-width="2"/>
  <line x1="110" y1="155" x2="150" y2="210" stroke="#4ade80" stroke-width="2"/>
  <line x1="290" y1="155" x2="250" y2="210" stroke="#4ade80" stroke-width="2"/>
  <line x1="290" y1="155" x2="330" y2="210" stroke="#4ade80" stroke-width="2"/>

  <!-- Similarity Distance circle around root -->
  <circle cx="200" cy="95" r="30" fill="none" stroke="#84cc16" stroke-width="1.5" stroke-dasharray="3 3"/>

  <text x="24" y="40" font-family="ui-monospace, monospace" font-size="15" fill="#f4f1e8" opacity="0.92" letter-spacing="0.5">Expert System CBR</text>
  <text x="24" y="272" font-family="ui-monospace, monospace" font-size="12" fill="#84cc16" opacity="0.95" letter-spacing="2">CASE-BASED REASONING &amp; NEAREST NEIGHBOR</text>
</svg>
