<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="P2P Terminal Chat cover">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <pattern id="p" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" fill="none" stroke="#ffffff" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="400" height="300" fill="url(#g)"/>
  <rect width="400" height="300" fill="url(#p)"/>
  <rect x="0" y="0" width="400" height="6" fill="#22c55e" opacity="0.8"/>
  <rect x="0" y="294" width="400" height="6" fill="#22c55e" opacity="0.8"/>

  <!-- P2P Terminal Mesh & Raw TCP socket lines -->
  <rect x="60" y="90" width="100" height="70" rx="4" fill="none" stroke="#22c55e" stroke-width="2.5"/>
  <text x="75" y="125" font-family="ui-monospace, monospace" font-size="12" fill="#22c55e">>_ node1</text>
  <circle cx="140" cy="105" r="4" fill="#22c55e"/>

  <rect x="240" y="130" width="100" height="70" rx="4" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="255" y="165" font-family="ui-monospace, monospace" font-size="12" fill="#38bdf8">>_ node2</text>
  <circle cx="320" cy="145" r="4" fill="#38bdf8"/>

  <!-- Bi-directional TCP Socket Flow -->
  <path d="M160 120 C 200 120, 200 155, 240 155" fill="none" stroke="#22c55e" stroke-width="2" stroke-dasharray="5 3"/>
  <path d="M240 170 C 200 170, 200 140, 160 140" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="5 3"/>

  <text x="24" y="40" font-family="ui-monospace, monospace" font-size="15" fill="#f4f1e8" opacity="0.92" letter-spacing="0.5">P2P Terminal Chat</text>
  <text x="24" y="272" font-family="ui-monospace, monospace" font-size="12" fill="#22c55e" opacity="0.95" letter-spacing="2">TCP SOCKETS &amp; ENCRYPTED MESH</text>
</svg>
